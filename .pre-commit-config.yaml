repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Run the linter
      - id: ruff
        args: ["--fix"]
      # Run the formatter
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
        # Files over 2 MB are rejected. Do NOT add them via git-lfs: LFS bandwidth is
        # metered against the repository owner, and every clone that fetches an LFS object
        # draws on a 10 GiB/month allowance, while ordinary git objects draw on none of it.
        # Small binaries belong in git as ordinary blobs; assets in the hundreds of MB
        # belong in external hosting. See .gitattributes for the paths still on LFS.
        args: ["--maxkb=2000"]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: end-of-file-fixer
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
        - tomli
        args: [-L lamda]
  # FIXME: Figure out why this is getting stuck under VPN.
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.315
  #   hooks:
  #   - id: pyright
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.(py|ya?ml)$
        args:
          # - --remove-header    # Remove existing license headers. Useful when updating license.
          - --license-filepath
          - .github/LICENSE_HEADER.txt
          - --use-current-year
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

# NOTE: three entries below are load-bearing, not just noise reduction:
#   .vscode/                 -> tools/setup_vscode.py, Isaac Lab BSD-3-Clause
#   scripts/newton_examples/ -> 3 files, Newton Developers Apache-2.0
#   task1_isaacsim/          -> cable_world/*.py, Newton Developers Apache-2.0
# All are .py, so they match insert-license's `files:` filter above, and these
# exclusions are the only thing stopping the hook from stamping an EBiM
# copyright on top of a third party's. Verified: at a non-excluded path the
# hook does stamp them, and pre-commit still reports success. Before removing
# any of the three, add a per-hook `exclude:` to insert-license covering those
# paths (tested: the hook then reports Skipped).
# LICENSES/README.md covers the Isaac Lab case in detail; the Newton-headered
# files are Apache-2.0, same as this repo's root LICENSE.
# task3_mujoco/assets/ is excluded for the same reason as the root assets/:
# it is mesh and texture data, not source. Wavefront .obj is ASCII, so without
# this the whitespace hooks rewrite every mesh file on each run. Only the assets
# subtree is excluded — task3_mujoco's Python, XML, and shell files stay covered
# by the file-safety hooks. That directory is ported from an upstream repo but
# was contributed under Apache-2.0 (see NOTICE), so insert-license DOES stamp
# its single .py file; it is excluded from Ruff only, via extend-exclude in
# pyproject.toml, because reformatting to line-length 79 would churn tuned
# control code.
exclude: ^(scripts/deprecated/|scripts/manual_tests/|scripts/newton_examples/|assets/|DEMO/|docker/|.vscode/|.github/|task1_isaacsim/|task1_mujoco/|task3_mujoco/assets/)
