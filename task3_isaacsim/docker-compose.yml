services:
  ros_republisher:
    image: ros:jazzy-ros-base
    container_name: task3_ros_republisher
    network_mode: host
    ipc: host
    working_dir: /workspace
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      python3 /workspace/scripts/controllers/ros_joint_republisher.py --bridge-prefix ${REPUBLISHER_BRIDGE_PREFIX:-/bridge} --isaac-prefix ${REPUBLISHER_ISAAC_PREFIX:-/isaac} --gripper-open-position ${REPUBLISHER_GRIPPER_OPEN_POSITION:-0.0} --gripper-closed-position ${REPUBLISHER_GRIPPER_CLOSED_POSITION:-0.8} $([ \"${REPUBLISHER_GRIPPER_INVERT:-false}\" = \"true\" ] && echo '--gripper-invert') $([ \"${REPUBLISHER_DISABLE_BROWSER_COMMAND_TOPICS:-false}\" = \"true\" ] && echo '--disable-browser-command-topics')"
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - PYTHONPATH=/workspace/scripts
    volumes:
      - ../task1_isaacsim:/workspace
    restart: unless-stopped
    tty: true
    stdin_open: true

  position_controller:
    image: ros:jazzy-ros-base
    container_name: task3_position_controller
    network_mode: host
    ipc: host
    working_dir: /workspace
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      python3 /workspace/scripts/controllers/joint_position_controller.py"
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../task1_isaacsim:/workspace
    restart: unless-stopped
    tty: true
    stdin_open: true
    profiles: [position]

  teleop_adapters:
    image: ros:jazzy-ros-base
    container_name: task3_teleop_adapters
    network_mode: host
    ipc: host
    working_dir: /workspace
    command: bash /workspace/services/teleop_adapters/start_teleop_adapters.sh
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - TELEOP_ADAPTERS=${TELEOP_ADAPTERS:-keyboard gello}
    volumes:
      - ../task1_isaacsim:/workspace
    restart: unless-stopped
    tty: true
    stdin_open: true
    profiles: [teleop]

  browser_controller:
    build:
      context: ../task1_isaacsim/services/browser_controller
      dockerfile: Dockerfile
    container_name: task3_browser_controller
    network_mode: host
    ipc: host
    depends_on: [ros_republisher]
    working_dir: /workspace
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      python3 /workspace/services/browser_controller/app.py --host 0.0.0.0 --port 8090 --publish-rate 60.0"
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - PYTHONPATH=/workspace/services/browser_controller:/workspace/scripts
    volumes:
      - ../task1_isaacsim:/workspace
    restart: unless-stopped
    tty: true
    stdin_open: true

  lerobot_recorder:
    build:
      context: services/recording
      dockerfile: Dockerfile
    image: task3-lerobot-recorder
    container_name: task3_lerobot_recorder
    # Run as the host user so datasets land on the bind mount with the
    # caller's ownership instead of root. scripts/run_recorder.sh exports
    # HOST_UID/HOST_GID automatically; export them yourself first if
    # invoking `docker compose --profile record` directly.
    #user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: host
    ipc: host
    working_dir: /repo/task3_isaacsim
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      python3 services/recording/record_task3.py
      --config ${RECORDER_CONFIG:-services/recording/recording.yaml}
      ${RECORDER_ARGS:-}"
    environment:
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # The host uid has no passwd entry in the container; give HF/rerun
      # caches a writable HOME.
      - HOME=/tmp
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - ..:/repo
    stdin_open: true
    tty: true
    profiles:
      - record